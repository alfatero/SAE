{% extends "app1/gabarit.html" %}
{% load static %}

{% block title %}Accueil - Sélection/Création de compte{% endblock %}

{% block extra_head %}
  <link rel="stylesheet" href="{% static 'app1/index.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
{% endblock %}

{% block content %}
  <div class="admin-bar">
    <a href="{% url 'client-list' %}" class="btn-admin-top">Gérer les comptes</a>
  </div>
  <div class="main-title" style="margin:70px 0 64px 0; text-align:center;">
    Bienvenue
  </div>
  <div class="center-btns">
    <a href="{% url 'categorie-grid' %}" class="big-btn btn-blue">
      <i class="fa-solid fa-basket-shopping"></i><br>
      Faire une<br>commande
    </a>
    <a href="{% url 'client-create' %}" class="big-btn btn-green">
      <i class="fa-solid fa-user-plus"></i><br>
      Créer votre<br>compte
    </a>
  </div>
{% endblock %}
