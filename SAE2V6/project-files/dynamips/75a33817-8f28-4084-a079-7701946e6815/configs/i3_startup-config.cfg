!
!
!
!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R2
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
!
!
ip cef
no ip domain lookup
!
!
ip auth-proxy max-nodata-conns 3
ip admission max-nodata-conns 3
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
! 
!
!
!
!
interface FastEthernet0/0
 ip address 192.168.137.25 255.255.255.248
 ip access-group 100 in
 ip access-group 100 out
 ip helper-address 192.168.137.242
 duplex auto
 speed auto
!
interface FastEthernet0/1
 ip address 192.168.137.42 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet1/0
 ip address 192.168.137.46 255.255.255.252
 duplex auto
 speed auto
!
router rip
 version 2
 network 192.168.137.0
 no auto-summary
!
no ip http server
no ip http secure-server
ip forward-protocol nd
!
!
!
access-list 100 permit tcp any any eq 22
access-list 100 permit tcp any eq 22 any
access-list 100 permit tcp any any eq www
access-list 100 permit tcp any eq www any
access-list 100 permit tcp any any eq 873
access-list 100 permit tcp any eq 873 any
access-list 100 permit udp any eq bootpc any eq bootps
access-list 100 permit udp any eq bootps any eq bootpc
no cdp log mismatch duplex
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
