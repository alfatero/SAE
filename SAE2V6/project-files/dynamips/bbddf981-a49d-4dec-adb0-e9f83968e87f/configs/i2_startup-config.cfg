!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R3
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
!
!
ip cef
no ip domain lookup
!
!
ip auth-proxy max-nodata-conns 3
ip admission max-nodata-conns 3
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
! 
!
!
!
!
interface FastEthernet0/0
 ip address dhcp
 ip nat outside
 ip virtual-reassembly
 duplex auto
 speed auto
!
interface FastEthernet0/1
 ip address 192.168.137.34 255.255.255.252
 ip nat inside
 ip virtual-reassembly
 duplex auto
 speed auto
!
interface FastEthernet1/0
 ip address 192.168.137.45 255.255.255.252
 ip nat inside
 ip virtual-reassembly
 duplex auto
 speed auto
!
router rip
 version 2
 network 192.168.137.0
 default-information originate
 no auto-summary
!
no ip http server
no ip http secure-server
ip forward-protocol nd
ip route 0.0.0.0 0.0.0.0 dhcp
!
!
ip nat inside source list 1 interface FastEthernet0/0 overload
!
!
ip access-list extended ACL_ICMP_HTTP
 permit icmp any any
 permit tcp any any eq www
 permit tcp any any established
 deny   ip any any
access-list 1 permit 192.168.137.24 0.0.0.7
access-list 1 permit 192.168.137.16 0.0.0.7
access-list 1 permit 192.168.137.8 0.0.0.7
access-list 1 permit 192.168.137.0 0.0.0.7
access-list 1 permit 192.168.137.240 0.0.0.3
no cdp log mismatch duplex
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
